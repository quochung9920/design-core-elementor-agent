name: Owner MCP parity and Vietnamese docs

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'tests/mcp-abilities/**'
      - 'tools/export-mcp-contract.php'
      - 'tools/check-vietnamese-docs.py'
      - 'README.vi.md'
      - 'docs/vi/**'
      - '.github/workflows/owner-mcp-parity.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'tests/mcp-abilities/**'
      - 'tools/export-mcp-contract.php'
      - 'tools/check-vietnamese-docs.py'
      - 'README.vi.md'
      - 'docs/vi/**'
      - '.github/workflows/owner-mcp-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          find core tests/mcp-abilities -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l tools/export-mcp-contract.php
      - name: Owner API and existing platform regressions
        run: |
          php tests/gpt-actions-api/run.php
          php tests/api-platform/run.php
          php tests/reference-integration/run.php
      - name: Canonical parity and permission/transport tests
        run: php tests/mcp-abilities/run.php
      - name: Generated Vietnamese API documentation
        run: php tools/export-mcp-contract.php --check
      - name: Vietnamese documentation links
        run: python3 tools/check-vietnamese-docs.py
