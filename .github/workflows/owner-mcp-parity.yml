name: Local agent parity
on:
  push:
    branches: [main]
    paths: ['core/agent/**','core/design-*.php','core/page-*.php','core/section-recipe-library.php','tests/design-brain/**']
  pull_request:
    paths: ['core/agent/**','core/design-*.php','core/page-*.php','core/section-recipe-library.php','tests/design-brain/**']
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', coverage: none }
      - run: php tests/agent-contract/run.php
      - run: php tests/design-brain/run.php
      - run: php tools/export-agent-contract.php --check
