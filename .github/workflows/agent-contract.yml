name: Agent contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring
          coverage: none
      - name: PHP syntax
        run: find core/agent tests/agent-contract -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Agent contract and security regressions
        run: php tests/agent-contract/run.php
      - name: Generated contract
        run: php tools/export-agent-contract.php --check
      - name: Existing MCP regressions
        run: php tests/mcp-abilities/run.php
      - name: Existing documentation checks
        run: |
          php tools/export-mcp-contract.php --check
          python3 tools/check-vietnamese-docs.py
