name: Local agent contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { php: ['8.1','8.4'] }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}', coverage: none }
      - name: PHP syntax
        run: find core -maxdepth 2 -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/agent-contract/run.php
      - run: php tests/design-brain/run.php
      - run: php tools/export-agent-contract.php --check
      - run: python3 tools/check-vietnamese-docs.py
