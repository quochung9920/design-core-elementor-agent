name: Production CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  php-contracts:
    strategy:
      fail-fast: false
      matrix: { php: ['8.1','8.2','8.3'] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}' }
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Core contracts
        run: |
          php tests/architecture/run.php
          php tests/registry/run.php
          php tests/native-fidelity/run.php
          php tests/strict-native/run.php
          php tests/responsive-compiler/run.php
          php tests/design-intelligence/run.php
          php tests/design-brain/run.php
          php tests/rc19-intelligence/run.php
          php tests/rc20-fidelity/run.php
          php tests/figma-fidelity/run.php
          php tests/figma-fidelity/adapter.php
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Multi-viewport evidence
        run: |
          node scripts/browser-analyze-target.mjs "$GITHUB_WORKSPACE/tests/fixtures/benchmark-hero-split.html" 1440,1024,768,390 > /tmp/target.json
          node -e "const x=require('/tmp/target.json'); if(!x.viewports || !x.viewports['390'] || !x.viewports['1440']) process.exit(1)"
      - name: Screenshot comparison
        run: |
          node scripts/capture-page.mjs "$GITHUB_WORKSPACE/tests/fixtures/marketing.html" 390 /tmp/ref.png
          node scripts/capture-page.mjs "$GITHUB_WORKSPACE/tests/fixtures/marketing.html" 390 /tmp/cand.png
          node scripts/visual-compare.mjs /tmp/ref.png /tmp/cand.png > /tmp/visual.json
          node -e "const x=require('/tmp/visual.json'); if(!x.comparable || x.similarity < .999) process.exit(1)"
