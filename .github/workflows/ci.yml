name: Production CI
# NOTE: Local CI (./scripts/ci-local.sh, docs/local-ci.md) is the primary
# developer validation workflow. This file mirrors the same entrypoints so
# the two never drift into unrelated copies of test commands.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  php-contracts:
    strategy:
      fail-fast: false
      matrix: { php: ['8.1','8.2','8.3'] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}' }
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax (same as ci-local.sh)
        run: find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l
      - name: Core contracts (same list as scripts/ci-local.sh)
        run: |
          for t in architecture registry native-fidelity strict-native responsive-compiler design-intelligence design-brain rc19-intelligence rc20-fidelity reference-integration fixed-width-governance pawcare-benchmark; do php tests/$t/run.php; done
          php tests/figma-fidelity/run.php
          php tests/figma-fidelity/adapter.php
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Multi-viewport evidence (same as ci-local.sh)
        run: |
          node scripts/browser-analyze-target.mjs "$GITHUB_WORKSPACE/tests/fixtures/benchmark-hero-split.html" 1440,1024,768,390 > /tmp/target.json
          node -e "const x=require('/tmp/target.json'); for (const w of ['1440','1024','768','390']) { if(!x.viewports || !x.viewports[w] || !x.viewports[w].length) process.exit(1) }"
      - name: Screenshot comparison (same as ci-local.sh)
        run: |
          node scripts/capture-page.mjs "$GITHUB_WORKSPACE/tests/fixtures/marketing.html" 390 /tmp/ref.png
          node scripts/capture-page.mjs "$GITHUB_WORKSPACE/tests/fixtures/marketing.html" 390 /tmp/cand.png
          node scripts/visual-compare.mjs /tmp/ref.png /tmp/cand.png > /tmp/visual.json
          node -e "const x=require('/tmp/visual.json'); if(!x.comparable || x.similarity < .999) process.exit(1)"
