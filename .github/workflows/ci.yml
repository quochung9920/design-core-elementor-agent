name: Production CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  php-lint:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Architecture contracts
        run: php tests/architecture/run.php
      - name: Registry validation and rollback
        run: php tests/registry/run.php
      - name: Native fidelity contracts
        run: php tests/native-fidelity/run.php
      - name: Asset URL resolver and fixed-width governance contracts
        run: |
          php tests/asset-url-resolver/run.php
          php tests/fixed-width-governance/run.php
      - name: Ability permission contracts
        run: php tests/ability-permissions/run.php
      - name: Responsive compiler contracts
        run: php tests/responsive-compiler/run.php
      - name: Strict native binding contracts
        run: php tests/strict-native/run.php
      - name: Settings regressions
        run: php tests/settings/run.php
      - name: RC19 intelligence contracts
        run: php tests/rc19-intelligence/run.php
      - name: RC20 fidelity contracts
        run: php tests/rc20-fidelity/run.php
      - name: RC21 remote API contracts
        run: php tests/remote-api-v2/run.php
      - name: Existing page transaction P0 safety
        run: php tests/remote-api-v2/p0-existing-page-transaction-safety.php
      - name: Design Intelligence contracts
        run: php tests/design-intelligence/run.php
      - name: Five-project reference integration contracts
        run: php tests/reference-integration/run.php

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit tests (tool schemas/annotations, site binding, design intelligence, idempotency)
        run: npm test

  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser tooling
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: JS syntax
        run: npm run check
      - name: Computed-style benchmark
        run: |
          node scripts/browser-analyze.mjs "$GITHUB_WORKSPACE/tests/fixtures/responsive.html" 1440,1024,768,390 > /tmp/browser.json
          node -e "const x=require('/tmp/browser.json'); if(!x.viewports || !x.viewports['390'] || !x.viewports['1440']) process.exit(1)"
      - name: Rendered target evidence smoke
        run: |
          node scripts/browser-analyze-target.mjs "$GITHUB_WORKSPACE/tests/fixtures/benchmark-hero-split.html" 1440,767,390 > /tmp/target-browser.json
          node -e "const x=require('/tmp/target-browser.json'); if(x.schema_version!==4 || !x.viewports || !x.viewports['390'] || x.network_policy!=='blocked') process.exit(1)"
      - name: Screenshot/diff tooling smoke
        # Fixture-vs-itself only proves capture-page.mjs/visual-compare.mjs work; it is NOT
        # production visual evidence (that requires comparing against an actually generated
        # Elementor page -- see the "Responsive visual QA" step in the wordpress-elementor job).
        run: |
          node scripts/capture-page.mjs "$GITHUB_WORKSPACE/tests/fixtures/marketing.html" 390 /tmp/ref.png
          node scripts/capture-page.mjs "$GITHUB_WORKSPACE/tests/fixtures/marketing.html" 390 /tmp/candidate.png
          node scripts/visual-compare.mjs /tmp/ref.png /tmp/candidate.png > /tmp/visual.json
          node -e "const x=require('/tmp/visual.json'); if(!x.comparable || x.similarity < 0.999) process.exit(1)"

  wordpress-elementor:
    needs: [browser-qa]
    runs-on: ubuntu-latest
    env:
      # Ephemeral, disposable CI-only WordPress install -- never production. Real-runtime
      # gates (e.g. tests/runtime/elementor-roundtrip.php) refuse to mutate anything unless
      # wp_get_environment_type() reports local/development/staging.
      WP_ENVIRONMENT_TYPE: local
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser tooling
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install WP-CLI
        run: |
          curl -L -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
      - name: Install WordPress and Elementor
        run: |
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root
          wp core install --url=http://127.0.0.1:8080 --title=DesignCoreCI --admin_user=admin --admin_password=password --admin_email=ci@example.com --skip-email --allow-root
          wp plugin install elementor --activate --allow-root
          ln -s "$GITHUB_WORKSPACE" /tmp/wp/wp-content/plugins/design-core-elementor
          wp plugin activate design-core-elementor --allow-root
      - name: Real existing-page roundtrip and rollback gate
        run: cd /tmp/wp && wp eval-file "$GITHUB_WORKSPACE/tests/runtime/elementor-roundtrip.php" --allow-root
      - name: Production regression suite
        run: cd /tmp/wp && wp eval-file "$GITHUB_WORKSPACE/tests/production-smoke.php" --allow-root
      - name: Custom widget multi-instance gate
        run: cd /tmp/wp && wp eval-file "$GITHUB_WORKSPACE/tests/custom-widget-multi-instance-smoke.php" --allow-root
      - name: Global design system gate
        run: cd /tmp/wp && wp eval-file "$GITHUB_WORKSPACE/tests/global-design-system-smoke.php" --allow-root
      - name: Planner strategy matrix gate
        run: cd /tmp/wp && wp eval-file "$GITHUB_WORKSPACE/tests/planner-strategy-matrix-smoke.php" --allow-root
      - name: Native widget semantic execution gate
        run: cd /tmp/wp && wp eval-file "$GITHUB_WORKSPACE/tests/native-widget-smoke.php" --allow-root
      - name: Visual correction runtime gate
        run: cd /tmp/wp && wp eval-file "$GITHUB_WORKSPACE/tests/visual-correction-smoke.php" --allow-root
      - name: Multi-section fallback gate
        run: cd /tmp/wp && wp eval-file "$GITHUB_WORKSPACE/tests/multi-section-fallback-smoke.php" --allow-root
      - name: Loop strategy gate
        run: cd /tmp/wp && wp eval-file "$GITHUB_WORKSPACE/tests/loop-strategy-smoke.php" --allow-root
      - name: Atomic runtime gates (public-API capability + real Design Core roundtrip when governed)
        run: cd /tmp/wp && wp eval-file "$GITHUB_WORKSPACE/tests/atomic-runtime-smoke.php" --allow-root
      - name: Responsive visual QA (generated page vs source fixture, not fixture vs itself)
        run: |
          cd /tmp/wp
          PAGE_ID=$(wp eval '$s=file_get_contents("'"$GITHUB_WORKSPACE"'/tests/fixtures/responsive.html"); preg_match("/<style[^>]*>(.*?)<\/style>/is",$s,$m); preg_match("/<body[^>]*>(.*?)<\/body>/is",$s,$b); $r=(new Design_Core_Elementor_HTML_Converter())->convert_to_elementor($b[1]??$s,$m[1]??"","Responsive Visual QA CI"); if("success"!==($r["status"]??"")){fwrite(STDERR,"conversion-failed:".($r["error"]??"unknown"));exit(1);} wp_publish_post((int)$r["page_id"]); echo (int)$r["page_id"];' --allow-root)
          echo "Generated page ID: $PAGE_ID"
          nohup wp server --host=127.0.0.1 --port=8080 --allow-root > /tmp/wp-server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf "http://127.0.0.1:8080/?page_id=$PAGE_ID" >/dev/null && break; sleep 1; done
          mkdir -p /tmp/visual-qa
          FAIL=0
          for W in 1440 1024 768 390; do
            node "$GITHUB_WORKSPACE/scripts/capture-page.mjs" "http://127.0.0.1:8080/?page_id=$PAGE_ID" "$W" "/tmp/visual-qa/generated-$W.png" > "/tmp/visual-qa/gen-$W.json"
            node "$GITHUB_WORKSPACE/scripts/capture-page.mjs" "$GITHUB_WORKSPACE/tests/fixtures/responsive.html" "$W" "/tmp/visual-qa/fixture-$W.png" > "/tmp/visual-qa/fix-$W.json"
            node "$GITHUB_WORKSPACE/scripts/visual-compare.mjs" "/tmp/visual-qa/fixture-$W.png" "/tmp/visual-qa/generated-$W.png" > "/tmp/visual-qa/cmp-$W.json"
            node -e "
              const fs=require('fs');
              const cmp=JSON.parse(fs.readFileSync('/tmp/visual-qa/cmp-$W.json'));
              const gen=JSON.parse(fs.readFileSync('/tmp/visual-qa/gen-$W.json'));
              const out={viewport:$W, comparable:cmp.comparable===true, similarity:cmp.similarity??0, overflow:gen.horizontal_overflow===true};
              fs.writeFileSync('/tmp/visual-qa/result-$W.json', JSON.stringify(out));
              console.log(JSON.stringify(out));
              if(!out.comparable || out.similarity < 0.95 || out.overflow) process.exit(1);
            " || FAIL=1
          done
          node -e "
            const fs=require('fs');
            const results=[1440,1024,768,390].map(w=>JSON.parse(fs.readFileSync('/tmp/visual-qa/result-'+w+'.json')));
            fs.writeFileSync('/tmp/visual-qa/summary.json', JSON.stringify(results));
          "
          if [ "$FAIL" = "1" ]; then echo "Responsive visual QA failed the threshold at one or more viewports."; exit 1; fi
          wp eval '$d=json_decode(file_get_contents("/tmp/visual-qa/summary.json"),true); (new Design_Core_Elementor_Runtime_Evidence())->record("responsive-visual-qa","pass",array("viewports"=>$d,"source"=>"generated-page-vs-fixture"),"github-actions"); echo "responsive-visual-qa=pass\n";' --allow-root
      - name: Architecture must remain at least a production candidate
        run: |
          cd /tmp/wp
          wp eval '$r=(new Design_Core_Elementor_Production_Readiness())->audit(); echo wp_json_encode($r,JSON_PRETTY_PRINT).PHP_EOL; if("not-ready"===($r["status"]??"")){throw new Exception("Required architecture/capability gate did not pass");}' --allow-root

  wordpress-minimum:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_min
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Install WP-CLI
        run: |
          curl -L -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
      - name: Minimum supported WordPress smoke
        run: |
          mkdir -p /tmp/wp-min && cd /tmp/wp-min
          wp core download --version=6.5.5 --allow-root
          wp config create --dbname=wordpress_min --dbuser=root --dbpass=root --dbhost=127.0.0.1:3307 --allow-root
          wp core install --url=http://localhost --title=DesignCoreMin --admin_user=admin --admin_password=password --admin_email=ci@example.com --skip-email --allow-root
          wp plugin install elementor --activate --allow-root
          ln -s "$GITHUB_WORKSPACE" /tmp/wp-min/wp-content/plugins/design-core-elementor
          wp plugin activate design-core-elementor --allow-root
          wp design-core compatibility --allow-root

  elementor-pro-loop:
    runs-on: ubuntu-latest
    env:
      ELEMENTOR_PRO_ZIP_URL: ${{ secrets.ELEMENTOR_PRO_ZIP_URL }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_pro
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Elementor Pro runtime not configured
        if: env.ELEMENTOR_PRO_ZIP_URL == ''
        run: echo "Elementor Pro runtime gate skipped because ELEMENTOR_PRO_ZIP_URL is not configured."
      - uses: shivammathur/setup-php@v2
        if: env.ELEMENTOR_PRO_ZIP_URL != ''
        with:
          php-version: '8.2'
      - name: Install and validate Elementor Pro Loop runtime
        if: env.ELEMENTOR_PRO_ZIP_URL != ''
        run: |
          curl -L -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          mkdir -p /tmp/wp-pro && cd /tmp/wp-pro
          wp core download --allow-root
          wp config create --dbname=wordpress_pro --dbuser=root --dbpass=root --dbhost=127.0.0.1:3308 --allow-root
          wp core install --url=http://localhost --title=DesignCorePro --admin_user=admin --admin_password=password --admin_email=ci@example.com --skip-email --allow-root
          wp plugin install elementor --activate --allow-root
          curl -L "$ELEMENTOR_PRO_ZIP_URL" -o /tmp/elementor-pro.zip
          wp plugin install /tmp/elementor-pro.zip --activate --allow-root
          ln -s "$GITHUB_WORKSPACE" /tmp/wp-pro/wp-content/plugins/design-core-elementor
          wp plugin activate design-core-elementor --allow-root
          wp eval '$c=(new Design_Core_Elementor_Capability_Scanner())->scan(); if(empty($c["elementor"]["loop_available"])) throw new Exception("Elementor Pro Loop runtime unavailable"); echo "pro-loop-capability=pass\n";' --allow-root
