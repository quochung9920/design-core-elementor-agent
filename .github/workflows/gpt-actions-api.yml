name: Agent API compatibility
on:
  push:
    branches: [main]
    paths: ['core/**','design-core-elementor.php','tests/agent-contract/**','tests/design-brain/**']
  pull_request:
    paths: ['core/**','design-core-elementor.php','tests/agent-contract/**','tests/design-brain/**']
jobs:
  local-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', coverage: none }
      - run: php tests/agent-contract/run.php
      - run: php tests/design-brain/run.php
      - run: php tools/export-agent-contract.php --check
