# rc21 example stack for local WSL2/Docker development:
#   Windows -> WSL2 -> Docker Compose -> { db, wordpress, design-core-mcp }
#
# design-core-mcp reaches WordPress over the internal Docker network by service
# name (http://wordpress), never localhost/127.0.0.1 -- that hostname only makes
# sense from the Windows/WSL2 host, not from inside another container.
#
# db has NO published port: only wordpress/wpcli need to reach it, over the
# internal network. design-core-mcp's dev port is bound to 127.0.0.1 only, never
# 0.0.0.0 -- a Secure MCP Tunnel (or your own reverse proxy) is the only intended
# path in from outside this machine; see docs/mcp-local-wsl-docker.md.
#
# Run: cp .env.example .env, then edit it, then `docker compose up -d`.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-design_core}
      MYSQL_USER: ${DB_USER:-design_core}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - design_core_db_data:/var/lib/mysql
    networks:
      - design-core-internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: ${WP_IMAGE:-wordpress:php8.3-apache}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Windows/WSL2 browser access only -- deliberately bound to loopback, not 0.0.0.0.
      - "127.0.0.1:${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-design_core}
      WORDPRESS_DB_USER: ${DB_USER:-design_core}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}
    volumes:
      - wordpress_data:/var/www/html
      # This repository IS the plugin -- mount it directly so plugin edits are live.
      - ./:/var/www/html/wp-content/plugins/design-core-elementor
    networks:
      - design-core-internal

  wpcli:
    image: ${WPCLI_IMAGE:-wordpress:cli-php8.3}
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-design_core}
      WORDPRESS_DB_USER: ${DB_USER:-design_core}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}
    volumes:
      - wordpress_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/design-core-elementor
    networks:
      - design-core-internal
    entrypoint: ["wp"]
    profiles: ["tools"] # `docker compose run --rm wpcli <command>`, not started by `up`

  design-core-mcp:
    build:
      context: ./mcp-server
    restart: unless-stopped
    depends_on:
      - wordpress
    environment:
      # Deliberately a literal, not ${HOST:-0.0.0.0} -- this binds inside the container's own
      # network namespace; host exposure is controlled entirely by the `ports:` mapping below.
      # Because it is hardcoded (not settable via .env), MCP_INBOUND_AUTH_MODE=none can never
      # start here even with MCP_ALLOW_INSECURE_LOCAL_AUTH=1 set: that mode also requires a
      # loopback HOST (127.0.0.1/::1/localhost), which this service is structurally unable to
      # provide. MCP_ALLOW_INSECURE_LOCAL_AUTH is DIRECT HOST LOOPBACK DEVELOPMENT ONLY -- for
      # running mcp-server's compiled server.js directly on your own machine (`node
      # dist/src/server.js`, no Docker), never for this Compose service. Do not add it here.
      HOST: 0.0.0.0
      PORT: 3000
      DESIGN_CORE_SITE_LOCAL_URL: http://wordpress
      DESIGN_CORE_SITE_LOCAL_TOKEN: ${DESIGN_CORE_SITE_LOCAL_TOKEN:?Create a machine credential under Design Core -> Remote Access in wp-admin, then set it here}
      DESIGN_CORE_SITE_LOCAL_ENVIRONMENT: local
      # Separate inbound credential for the public /mcp endpoint -- never the same value as
      # DESIGN_CORE_SITE_LOCAL_TOKEN above, which authenticates the bridge TO WordPress, not
      # callers TO the bridge. Generate with: openssl rand -base64 48
      MCP_INBOUND_AUTH_MODE: ${MCP_INBOUND_AUTH_MODE:-token}
      MCP_INBOUND_TOKEN: ${MCP_INBOUND_TOKEN:?Generate one with `openssl rand -base64 48`}
    ports:
      # Dev-only convenience for testing the bridge directly from the host.
      # Not required for the Secure MCP Tunnel path (Phase 11), which reaches this
      # container over the Docker network directly and needs no published port at all.
      - "127.0.0.1:${MCP_PORT:-3000}:3000"
    networks:
      - design-core-internal
    healthcheck:
      # /healthz is intentionally unauthenticated (see server.ts) -- /health now requires the
      # inbound token, so a probe with no Authorization header would otherwise always fail.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Public HTTPS ingress -- the ONLY service in this stack allowed to publish 80/443 to the
  # host. Terminates real, publicly-trusted TLS (automatic ACME via Caddy's zero-config
  # default for a real hostname) and reverse-proxies just /mcp and /healthz to design-core-mcp
  # over the private Docker network; see deploy/caddy/Caddyfile. Router port-forwarding (WAN
  # 443 -> this host's 443) and public DNS for MCP_PUBLIC_HOST are the operator's own
  # responsibility -- see docs/mcp-public-router.md.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - design-core-mcp
    environment:
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST:?Set MCP_PUBLIC_HOST in .env, e.g. mcp.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - design-core-internal

networks:
  design-core-internal:
    driver: bridge

volumes:
  design_core_db_data:
  wordpress_data:
  caddy_data:
  caddy_config:
